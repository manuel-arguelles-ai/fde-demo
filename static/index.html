<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fde-demo — Bot de soporte (Build track Forward Deployed Engineer)</title>
<style>
  :root{--bg:#0e1116;--card:#161b22;--acc:#4ea8de;--ok:#3fb950;--warn:#d29922;--tx:#e6edf3;--mut:#8b949e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh}
  header{padding:20px 24px;border-bottom:1px solid #21262d}
  h1{margin:0;font-size:18px}
  h1 span{color:var(--acc)}
  header p{margin:6px 0 0;color:var(--mut);font-size:13px}
  main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:12px 16px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .user{align-self:end;background:#1f6feb;color:#fff;border-bottom-right-radius:4px}
  .bot{align-self:start;background:var(--card);border:1px solid #21262d;border-bottom-left-radius:4px}
  .bot b{color:var(--acc)}
  .meta{align-self:start;color:var(--mut);font-size:12px}
  form{display:flex;gap:10px;padding:14px 24px;border-top:1px solid #21262d;max-width:808px;margin:0 auto;width:100%}
  input{flex:1;background:var(--card);border:1px solid #30363d;border-radius:10px;color:var(--tx);padding:12px 14px;font-size:15px}
  input:focus{outline:none;border-color:var(--acc)}
  button{background:#238636;border:none;color:#fff;border-radius:10px;padding:0 22px;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5}
  .esc{border-color:var(--warn);color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>🤖 fde-demo <span>· Forward Deployed Engineer</span></h1>
  <p>Bot de soporte de “Nix Cloud” — Build del track DataCamp: RAG (BM25) → gate anti-alucinación → LangGraph (arista condicional + feedback loop) → FastAPI con streaming SSE. Fuera del KB escala con function calling.</p>
</header>
<main id="log"></main>
<form id="f"><input id="q" placeholder="Pregunta algo… (ej.: me quedó filtrada la API key, ¿qué hago?)" autocomplete="off"><button id="b">Enviar</button></form>
<script>
const log=document.getElementById('log'),f=document.getElementById('f'),q=document.getElementById('q'),b=document.getElementById('b');
function md(t){
  let s=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code style="background:#21262d;padding:1px 5px;border-radius:5px;font-size:.92em">$1</code>');
  return s;
}
function add(cls,txt){const d=document.createElement('div');d.className='msg '+cls; if(txt!=null)d.innerHTML=md(txt);log.appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d}
f.onsubmit=async e=>{
  e.preventDefault();
  const question=q.value.trim(); if(!question) return;
  add('user',question); q.value=''; b.disabled=true;
  const bot=add('bot','');
  let src='';
  try{
    const res=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    const rd=res.body.getReader(),dec=new TextDecoder();
    let buf='',txt='';
    while(true){
      const {done,value}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
        if(!line.startsWith('data:')) continue;
        const d=JSON.parse(line.slice(5));
        if(d.delta){txt+=d.delta;bot.innerHTML=md(txt)}
        if(d.sources) src=d.sources;
      }
    }
    if(src){const m=document.createElement('div');m.className='meta';m.textContent='📚 fuentes: '+src.join(' · ');log.appendChild(m)}
  }catch(err){bot.textContent='⚠ error: '+err.message; bot.classList.add('esc')}
  b.disabled=false; q.focus();
};
add('bot','👋 Proba: “cuál es el rate limit del plan Pro?” (responde con citas) · “cómo hago un asado?” (escala con ticket)');
</script>
</body>
</html>
